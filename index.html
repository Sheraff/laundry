<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" type="text/css" href="style.css">
	<script src="script.js" type="module"></script>
	<title>Where to dry my laundry</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body>
	<h1>Where to dry my laundry</h1>
	<form>
		<fieldset id="outside">
			<legend>Outside</legend>
			<button type="button" id="fetchWeather">Auto-fill</button>
			<label for="outsideTemp">Outside temperature (°C)</label>
			<input type="number" id="outsideTemp" placeholder="Temperature (°C)" required />
			<label for="outsideHumidity">Outside humidity (%)</label>
			<input type="number" id="outsideHumidity" placeholder="Humidity (%)" min="0" max="100" />
			<label for="outsideWind">Outside wind speed (m/s)</label>
			<input type="number" id="outsideWind" placeholder="Wind speed (m/s)" />
			<label for="outsideSunshine">Sunshine (W/m²)</label>
			<input type="number" id="outsideSunshine" placeholder="Sunshine (W/m²)" />
			<output id="outsideResult" for="outsideTemp outsideHumidity outsideWind sunshine">0</output>
		</fieldset>
		<fieldset id="inside">
			<legend>Inside</legend>
			<label for="insideTemp">Inside temperature (°C)</label>
			<input type="number" id="insideTemp" placeholder="Temperature (°C)" required />
			<label for="insideHumidity">Inside humidity (%)</label>
			<input type="number" id="insideHumidity" placeholder="Humidity (%)" min="0" max="100" />
			<output id="insideResult" for="insideTemp insideHumidity insideWind">0</output>
		</fieldset>
		<output id="output" for="outsideTemp outsideHumidity outsideWind sunshine insideTemp insideHumidity"></output>
	</form>
</body>

</html>
